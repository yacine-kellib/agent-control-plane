[package]
name = "acp-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Real primitives, added for rule-store step 2 (ACP-36). Until these landed
# nothing in Rust could check a signature; verify_hybrid composed verdicts
# that nothing could produce.
ed25519-dalek = "3.0"
fips204 = "0.4"
# Identity, not hashing-in-general: `VerifyingKeys::fingerprint` is SHA-256 over
# both public halves, which is what an attester registry entry is keyed by
# (PB-KEY) and what `acp-bundle` puts inside the tree hash. It also re-executes
# the Python reference's seed-to-key derivation for the cross-language fixtures.
sha2 = "0.10"

[features]
# `kms` — T2 custody, IMPLEMENTED (ACP-61). Turns on `custody::KmsSigner` and
# the `KmsBackend` trait a deployment implements against its own KMS. Off by
# default because a build that cannot reach a KMS should not be able to name
# the tier: the refusal then happens at compile time rather than at the first
# production signature.
#
# `hsm` — T3 custody, DECLARED AND NOT IMPLEMENTED, in the same posture as the
# `slhdsa128s` suite: a build without it refuses the tier rather than
# downgrading to one it can operate. Enabling it without writing the backend
# would be worse than leaving it off, because a deployment would then believe
# its key is in an HSM while it sits in process memory.
#
# `tools/selftest.sh` runs `--features kms` and asserts it yields MORE tests
# than the default build. Without that, T2's tests would be compiled out of
# every command any gate runs and would pass forever by not existing.
default = []
kms = []
hsm = []

[dev-dependencies]
# Cross-language fixture only: the vector is emitted by the Python reference.
serde_json = "1"
hex = "0.4"
