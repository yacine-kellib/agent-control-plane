[package]
name = "acp-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.10"
# The tree hash covers the declared suite (CR-3), so the tree needs the suite
# TYPE, not a suite string. A `&str` here would let two spellings of one suite
# produce two tree hashes, which is the encoding split arriving through the
# door marked "it's only a label".
acp-crypto.workspace = true
# verify.rs needs BundleEpoch (PB-5) -- the newtype with no `Ord`, so a `>=`
# that would accept a replay of the current epoch is not reachable by a slip.
acp-core.workspace = true
# Reads the handful of SECURITY fields out of the signed manifest and registry
# bytes: bundle_epoch, expires_at, author/reviewer id, quorum_k, attester keys.
#
# This is NOT the typed bundle model, and must not grow into one. The schemas in
# spec/schemas/bundle/ are the normative source and the Rust types come from
# codegen -- a hand-written struct here would be a second definition of one
# object. Reading five named fields fail-closed is field access; defining the
# shape of the bundle is what waits for tools/codegen.sh.
serde_json = "1"

# Deliberately NOT depended on yet:
#   ciborium / serde — the encoder here is hand-rolled and 30 lines, because
#     what gets hashed must be readable in the file that says what it means.
#     A derive's output depends on field order and map-key handling that are
#     invisible at the call site.

[dev-dependencies]
# The walk is filesystem behaviour, so its tests need a real directory: what is
# being checked is that an unrecognised file type halts and that a symlink is
# refused, and neither is expressible against an in-memory list.
tempfile = "3"
