[package]
name = "acp-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.10"
# The tree hash covers the declared suite (CR-3), so the tree needs the suite
# TYPE, not a suite string. A `&str` here would let two spellings of one suite
# produce two tree hashes, which is the encoding split arriving through the
# door marked "it's only a label".
acp-crypto.workspace = true
# verify.rs needs BundleEpoch (PB-5) -- the newtype with no `Ord`, so a `>=`
# that would accept a replay of the current epoch is not reachable by a slip.
acp-core.workspace = true
# Carries the signed manifest and registry as documents. verify.rs no longer
# COERCES anything out of them -- there is not an `as_str`/`as_u64`/`as_object`
# left in the crate. Every field it reads goes through `verify::promoted`, which
# deserialises one named field into the type the schema declares for it, and a
# test compares those types against the generated projections field by field so
# the two cannot drift apart in silence.
#
# There is still no hand-written bundle struct here and there must never be one:
# spec/schemas/bundle/ is the normative source, the Rust types come from
# tools/codegen.sh, and a struct written here would be a second definition of an
# object the specification already defines.
#
# Nor is a whole-document `RawManifest`/`RawAttesterRegistry` deserialise the
# answer, which is worth writing down because it looks like the tidier one.
# serde fails the WHOLE struct on any wrongly-typed member, so it would (a)
# collapse every distinct absence into one Malformed, when these refusals are
# distinguishable by design and the cross-language differential asserts the
# name, and (b) start refusing bundles this verifier accepts today over fields
# no verifier reads -- `custody` above all, which the schema classifies T and
# which every fixture in this repository writes in a shape the strict type
# rejects. verify.rs's module doc carries the long form.
serde_json = "1"
# The `Deserialize` trait itself, for that promotion. No derive is used here --
# deriving a struct is precisely what this crate must not do; the types are
# acp-core's generated ones and serde's own scalars and maps.
serde.workspace = true

# Deliberately NOT depended on yet:
#   ciborium / serde — the encoder here is hand-rolled and 30 lines, because
#     what gets hashed must be readable in the file that says what it means.
#     A derive's output depends on field order and map-key handling that are
#     invisible at the call site.

[dev-dependencies]
# The walk is filesystem behaviour, so its tests need a real directory: what is
# being checked is that an unrecognised file type halts and that a symlink is
# refused, and neither is expressible against an in-memory list.
tempfile = "3"
