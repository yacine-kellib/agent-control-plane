[package]
name = "acp-decision"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The wire types, and with them the four fail-safe accessors this crate exists
# to CONSUME. acp-core's module docs already named this moment: "phase 9 puts
# the decision path in Rust, which is where a floors lookup returning `High`
# would have started being read." Until now those defaults set values nothing
# read, which by this repository's own rule makes them documentation rather
# than controls.
acp-core.workspace = true
# The §8.3.1 expression language. `raise_to[].if` is EL-1 source, so the fold
# below cannot grade anything without it.
acp-el1.workspace = true
# Slice 4: the receipt gate. CR-3's conjunctive combiner and CR-4's containment
# already live here; this crate consumes them rather than restating either.
acp-crypto.workspace = true
# Proposals arrive as canonical JSON. serde is already in the lock file.
serde.workspace = true
# The canonical encoder. See the workspace note on preserve_order.
serde_json.workspace = true
# AT-8a id derivation: "sha256:" + hex over the object's canonical bytes. Not
# hashing-in-general -- the attestation id IS a hash of signed bytes, and both
# languages must derive it identically or Y1b compares two different things.
# Already in the lock file via acp-crypto, so this pulls nothing new down.
sha2 = "0.10"

