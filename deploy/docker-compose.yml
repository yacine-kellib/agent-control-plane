# The control plane as running processes — one command.
#
# WHY ONE CONTAINER AND NOT SEVEN. The seven services already exist and already
# run as seven real OS processes (`sim.supervise`), but they talk over
# line-delimited JSON on stdio pipes (sim/services/_rpc.py), parent-spawns-child.
# Pipes do not cross container boundaries. Splitting this into seven containers
# means replacing that transport with network RPC first — real work, not
# packaging, and a change to the thing the isolation tests are about.
#
# So: one container, seven processes inside it, boundaries intact and asserted
# by `--checks`. The process separation is genuine; the container count is not
# what makes it genuine.
#
# The boundaries this preserves, all four asserted at run time by
# `docker compose run --rm checks`:
#
#   - the agent holds NO key material. It proposes; it is never a principal.
#   - policy and executor derive the signed bundle INDEPENDENTLY (RAD-4) — a
#     service handed a bundle over a pipe is trusting the peer that sent it.
#   - anchor runs outside the trust domain of what it anchors.
#   - notifier and approval share nothing above the wire format (DR-2).
#
# NOT DEPLOYABLE. The ledger is in-memory, the anchor is a
# list. The entrypoint prints all three and refuses to start without
# ACP_DEMONSTRATOR=1. See the Dockerfile header.

name: acp

x-demonstrator: &demonstrator
  build:
    context: ..
    dockerfile: Dockerfile
  image: acp-demonstrator:local
  environment:
    ACP_DEMONSTRATOR: "1"
  # Binds nothing and needs nothing. Two services override this: `ingress`,
  # which must accept a socket to be a door at all, and `agent`, which reaches
  # the model API. Note which way round that is — the component with network
  # access is the UNTRUSTED one, and the services holding keys and making
  # decisions still get `none`.
  network_mode: none
  read_only: true
  # A writable /tmp is REQUIRED, not incidental hardening slack. The three
  # mutation suites (21 executor + 6 ack + 4 audit = 31 mutants) work by copying
  # reference/src into a temp directory, deleting one check from the copy, and
  # running the matching attack against the mutant in a subprocess. On a fully
  # read-only filesystem they cannot write the mutant and the suites report
  # "no RESULT line" — which is exactly how this was found, by running
  # `docker compose run --rm verify` and watching three suites fail.
  # tmpfs keeps the root filesystem read-only while giving them somewhere to
  # build. The mutants never touch the image.
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # The day, across seven real OS processes. This is the default.
  day:
    <<: *demonstrator
    command: ["day"]

  # The four process-isolation properties, asserted. Fastest way to see that
  # the boundaries are real rather than drawn.
  checks:
    <<: *demonstrator
    command: ["checks"]

  # The business-facing numbers: 179 actions, 146 untouched, 14/14 attacks
  # well-formed, 0 executed, EUR 520,000 counterfactual.
  scoreboard:
    <<: *demonstrator
    command: ["scoreboard"]

  # 11 pass, 1 partial, 0 fail. The partial is reported rather than rounded up.
  acceptance:
    <<: *demonstrator
    command: ["acceptance"]

  # The repository's own gate, run inside the image: proofs + 13 suites.
  # Integrity and signature are deliberately NOT checked here — regenerating the
  # manifest requires the offline release key, which must never be in a
  # container image.
  verify:
    <<: *demonstrator
    command: ["verify"]

  # The door an external agent proposes through. THE ONLY SERVICE WITH A SOCKET.
  #
  #   docker compose -f deploy/docker-compose.yml up ingress
  #   curl -s localhost:8848/actions
  #
  # It overrides network_mode from the anchor above, because a door that cannot
  # be reached is not a door. Everything else about the hardening is kept, and
  # the published port is bound to the host's LOOPBACK: this is a demonstrator
  # whose ledger is a set in memory and whose anchor shares its process tree,
  # so exposing
  # it beyond the machine is a decision an operator makes deliberately by
  # editing this line, not a default they inherit.
  #
  # The process behind this socket holds no key, signs nothing and decides
  # nothing. Compromise it entirely and the guarantees are unchanged — which is
  # the only reason it is allowed to face a network at all.
  ingress:
    <<: *demonstrator
    command: ["ingress"]
    network_mode: ""
    ports:
      - "127.0.0.1:8848:8848"

  # A real model, really injected, proposing over HTTP to the door above.
  #
  #     export ANTHROPIC_API_KEY=sk-ant-...
  #     docker compose -f deploy/docker-compose.yml up -d ingress
  #     docker compose -f deploy/docker-compose.yml run --rm agent
  #
  # To pass flags, name the mode again -- `run` REPLACES this service's command
  # rather than appending to it, so the first `agent` selects the service and
  # the second selects the entrypoint mode:
  #
  #     docker compose -f deploy/docker-compose.yml run --rm agent agent --help
  #     docker compose -f deploy/docker-compose.yml run --rm agent agent --invent
  #
  # The key is passed to THIS service and to nothing else. `ingress`, `policy`,
  # `executor` and `approval` never receive it and could not use it — the whole
  # claim of the HTTP door is that the caller is untrusted, and a caller whose
  # credential the callee holds is not a caller, it is a subroutine.
  #
  # This is the only service with outbound internet, and it is the one the
  # architecture assumes is compromised. That is not an oversight to tighten
  # later; it is the shape of the argument.
  agent:
    <<: *demonstrator
    command: ["agent"]
    network_mode: ""
    depends_on: [ingress]
    environment:
      ACP_DEMONSTRATOR: "1"
      ACP_INGRESS: "http://ingress:8848"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  # The door, attacked over the wire it actually serves: 9/9.
  ingress-suite:
    <<: *demonstrator
    command: ["ingress-suite"]
