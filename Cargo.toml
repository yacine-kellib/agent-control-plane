[workspace]
resolver = "3"
members = [
    "crates/acp-core",
    "crates/acp-crypto",
    "crates/acp-bundle",
    "crates/acp-bundle-cli",
    "crates/acp-conformance",
    "services/executor",
    "services/policy",
    "services/ledger",
    "services/anchor",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
acp-core = { path = "crates/acp-core" }
acp-crypto = { path = "crates/acp-crypto" }
